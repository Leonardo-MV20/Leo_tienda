spring.application.name=tienda

#para definir el puerto donde "escuchará" el servidor
server.port=80

#Para definir el formato de despliegue de fecha/hora del log en la consola
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción "true"
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/techshop


#Conexión nube aiven a la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://techshop-leomoscoav20-c498.g.aivencloud.com:14351/techshop?sslMode=REQUIRED

#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name = techshop-bec9e.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
firebase.json.file = techshop-bec9e-firebase-adminsdk-fbsvc-d1bc3aab8c.json


#nombre del servidor donde está la tienda...
servidor.http=localhost
